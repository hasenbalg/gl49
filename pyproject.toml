[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glucobridge"
version = "0.2.0"
description = "Read blood glucose meters over Bluetooth LE (standard Glucose Profile: Beurer GL 49, Accu-Chek Guide; TESTAmed/FORA via proprietary backend)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "bleak>=0.22",
    "dbus-fast>=2",         # BlueZ pairing agent (also a bleak dep on Linux)
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]
usb = ["hidapi>=0.14"]          # GL49 USB (CP2110 HID-UART)

[project.scripts]
glucobridge = "glucobridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
